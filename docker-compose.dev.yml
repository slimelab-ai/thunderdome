services:
  analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    image: thunderdome-analytics:dev
    container_name: thunderdome_dev_analytics
    restart: always
    environment:
      ANALYTICS_DATA_DIR: /data
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
    volumes:
      - analytics-data:/data

  app-dev:
    build:
      context: .
      args:
        VITE_BUILD_SHA: ${VITE_BUILD_SHA:-unknown}
    image: thunderdome:dev
    container_name: thunderdome_dev_app
    restart: always
    depends_on:
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  tunnel-dev:
    image: cloudflare/cloudflared:latest
    user: "0:0"
    container_name: thunderdome_dev_tunnel
    restart: always
    volumes:
      - ./cloudflared-dev-config.yml:/etc/cloudflared/config.yml:ro
      - /home/patrick/.cloudflared/f45b8768-8e30-4a2e-9eb0-825d9a3d4b18.json:/etc/cloudflared/credentials.json:ro
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      app-dev:
        condition: service_healthy

networks:
  default:
    name: thunderdome_dev_net

volumes:
  analytics-data:
