server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The HTML shell names content-hashed assets and must always be revalidated.
    # Hashed JS/CSS/images remain immutable in the asset location below.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Short, controller-friendly entry point for the standalone Xbox lab.
    location = /xbox {
        try_files /xbox.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /api/analytics {
        proxy_pass http://analytics:8080/events;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        client_max_body_size 1m;
    }

    location /api/diagnostics/ {
        proxy_pass http://analytics:8080/diagnostics/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 1m;
    }

    # Ogg Opus is not present in every distro's stock mime.types. Media elements
    # should not have to sniff a generic octet stream, and the content-hashed query
    # makes these clips safe to keep across sessions.
    location ~* \.opus$ {
        types { audio/ogg opus; }
        default_type audio/ogg;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
